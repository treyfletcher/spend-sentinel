# CI (T10): ruff, mypy, pytest with coverage on 3.11/3.12.
# R21: the suite runs with no AWS credentials and no default region — the env
# step below unsets every AWS_* credential/region variable before pytest.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Type-check (mypy)
        run: python -m mypy
      - name: Tests (no AWS credentials, no default region — R21)
        run: |
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY \
              -u AWS_SESSION_TOKEN -u AWS_DEFAULT_REGION -u AWS_REGION \
              -u AWS_PROFILE \
              python -m pytest --cov=spend_sentinel --cov-report=term-missing
