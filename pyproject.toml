[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spend-sentinel"
version = "0.1.0"
description = "Terraform drift & cost sentinel: analyze Terraform plan JSON for cost, drift, and policy gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "spend-sentinel developers" }]
dependencies = [
    "click >= 8.1, < 9",
    "pydantic >= 2.7, < 3",
    "PyYAML >= 6.0, < 7",
]

[project.optional-dependencies]
aws = [
    "boto3 >= 1.34, < 2",
]
dev = [
    "pytest >= 8, < 9",
    "pytest-cov",
    "ruff >= 0.5",
    "mypy >= 1.10",
    "types-PyYAML",
]

[project.scripts]
spend-sentinel = "spend_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["spend_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["spend_sentinel"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
